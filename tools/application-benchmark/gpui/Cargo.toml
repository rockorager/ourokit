[package]
name = "ourokit-gpui-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[features]
workload = ["gpui/profiler", "dep:serde_json", "dep:libc"]

[[bin]]
name = "ourokit-gpui-workload"
path = "src/bin/workload.rs"
required-features = ["workload"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "017f9b89aa26bfcb015b3f05c3f2dff64704338d", default-features = false, features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "017f9b89aa26bfcb015b3f05c3f2dff64704338d", default-features = false, features = ["wayland"] }
env_logger = "0.11"
serde_json = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

# Preserve the GPUI-relevant patches from the pinned upstream workspace.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265" }

[profile.release]
debug = 0
strip = true
